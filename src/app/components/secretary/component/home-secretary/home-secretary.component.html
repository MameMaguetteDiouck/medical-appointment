<app-navbar-secretary></app-navbar-secretary>
<div class="main w-100 ">
    <div class="container d-flex justify-content-center align-items-center flex-column mb-5">
        <div class="row d-flex justify-content-between align-items-center mt-4 w-100">
            <div
                class="card col-3 mb-3 text-white couleur d-flex flex-column justify-content-center align-items-center">
                <h3>Nombre de rv</h3>
                <h5>{{ allAppointment.length }}</h5>
            </div>

            <div
                class="card col-3 mb-3 text-white couleur d-flex flex-column justify-content-center align-items-center">
                <h3>Nombres de doctors</h3>
                <h5>{{ allDoctors.length }}</h5>
            </div>

            <div
                class="card col-3 mb-3 text-white couleur d-flex flex-column justify-content-center align-items-center">
                <h3>Nombres de patients</h3>
                <h5>{{ allPatients.length }}</h5>
            </div>
        </div>
        <div class="w-100 row d-flex align-items-center justify-content-center">
            <div class="chartSecretary p-3">
                <canvas class="w-100" baseChart [data]="pieChartData" [type]="'pie'"
                    [options]="pieChartOptions"></canvas>
            </div>
            <div class="chartSecretary d-flex flex-column">
                <div class="h-50 w-100">
                    <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'bar'">
                    </canvas>
                </div>
                <div class="h-50 w-100">
                    <canvas baseChart [data]="barChartDataDay" [type]="'bar'">
                    </canvas>
                </div>
            </div>
        </div>
    </div>
</div>
<app-footer-secretary></app-footer-secretary>
